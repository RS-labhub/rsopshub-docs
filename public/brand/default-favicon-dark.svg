<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RsOpsHub">
  <!--
    RsOpsHub favicon.

    Rounded near-black tile with two stacked marks:
      • Top: serif "R" — the brand initial, set in the Instrument Serif
        spirit that the app uses for headings.
      • Bottom: the DevOps infinity loop ("Dev <-> Ops" CI/CD symbol),
        rendered as a thin stroke so it reads at small sizes.
    Two small accent dots sit at the loop's crossing to suggest the
    pipeline cycle (build / ship beats).
  -->
  <rect width="64" height="64" rx="14" ry="14" fill="#171717" />

  <!-- Serif "R" centered above the loop. -->
  <path
    fill="#FAFAFA"
    transform="translate(0 -3)"
    d="M22 12h11.4q4.4 0 6.9 2.4 2.5 2.4 2.5 6.1 0 2.8-1.5 4.9-1.5 2-3.9 2.9l5.6 8.5q.3.4.6.7.3.3.8.3v.4h-7l-6.6-12.9h-1.9v8.7q0 1.6.5 2.4.6.8 1.9 1v.4H22v-.4q1.3-.1 1.8-1 .5-.8.5-2.4V15.8q0-1.6-.5-2.4-.5-.9-1.8-1z M28 28.5h3.2q2.8 0 4.5-1.8 1.6-1.9 1.6-5 0-3.3-1.6-5.1-1.5-1.8-4.5-1.8H28z"
  />

  <!-- DevOps infinity loop. Stroke-only so it stays light at favicon
       sizes. The cubic curves trace a horizontal figure-eight. -->
  <path
    d="M16 50 C 16 42, 26 42, 32 50 C 38 58, 48 58, 48 50 C 48 42, 38 42, 32 50 C 26 58, 16 58, 16 50 Z"
    fill="none"
    stroke="#FAFAFA"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Two accent dots at the loop's crossing — DevOps pipeline beat. -->
  <circle cx="29" cy="50" r="1.1" fill="#FAFAFA" />
  <circle cx="35" cy="50" r="1.1" fill="#FAFAFA" />
</svg>
